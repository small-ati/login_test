<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>登录页面</title>
</head>
<body>
    <h1>登录</h1>

    <label for="username">用户名：</label>
    <input type="text" id="username" placeholder="请输入用户名"><br><br>

    <label for="password">密码：</label>
    <input type="password" id="password" placeholder="请输入密码"><br><br>
    <button id='toggle-pwd' onclick='togglePassword()'>显示密码</button>
    <label><input type="checkbox" id="remember"> 记住我</label><br><br>
    <label>性别：</label>
    <input type="radio" name="gender" value="male" id="gender-male"> 男
    <input type="radio" name="gender" value="female" id="gender-female"> 女<br><br>
    <label for ="login-type">登录方式：</label>
    <select id="login-type">
        <option value="password">密码登录</option>
        <option value="sms">短信登录</option>
    </select><br><br>
    <button id="login-btn" onclick="login()">登录</button>
<style>
    #message { font-size: 16px; }
    .error { color: red; }
    .success { color: green; }
</style>
    <div id="message"></div>

    <script>
        function login() {
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var message = document.getElementById('message');

            if (username === '' || password === '') {
                message.innerText = '请输入用户名和密码';
		message.className = 'error';
            } else if (username === 'admin' && password === '123456') {
                message.innerText = '登录成功';
		message.className = 'success';
            } else {
                message.innerText = '用户名或密码错误';
		message.className = 'error';
            }
	}
        function togglePassword() {
            var pwd = document.getElementById('password');
	    var btn = document.getElementById('toggle-pwd');
	    if (pwd.type === 'password') {
		pwd.type = 'text';
		btn.innerText = '隐藏密码';
	    } else {
		pwd.type = 'password';
		btn.innerText = '显示密码';
	    }
	}
    </script>
</body>
</html>
