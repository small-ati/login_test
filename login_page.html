<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>登录页面</title>
</head>
<body>
    <h1>登录</h1>

    <label for="username">用户名：</label>
    <input type="text" id="username" placeholder="请输入用户名"><br><br>

    <label for="password">密码：</label>
    <input type="password" id="password" placeholder="请输入密码"><br><br>

    <button id="login-btn" onclick="login()">登录</button>

    <div id="message"></div>

    <script>
        function login() {
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var message = document.getElementById('message');

            if (username === '' || password === '') {
                message.innerText = '请输入用户名和密码';
            } else if (username === 'admin' && password === '123456') {
                message.innerText = '登录成功';
            } else {
                message.innerText = '用户名或密码错误';
            }
        }
    </script>
</body>
</html>
